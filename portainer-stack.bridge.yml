# ZASTARALÉ – Lukas používá pouze VLAN (portainer-stack.yml). Bridge nechte nepoužité.
# Pokud tento soubor náhodou nasadíte, HOST_PORT default 18080 aby nekolidoval s Pi-hole :8080.

services:
  pin-manager:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: pin-manager:latest
    container_name: pin-manager
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18080}:8080"
    environment:
      TZ: Europe/Prague
      LISTEN_PORT: "8080"
      DEPLOY_MODE: bridge
      PORTAL_IP: ${PORTAL_IP:-192.168.39.207}
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      PIN: ${PIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - pin-manager-data:/data
      - type: bind
        source: ${DNSMASQ_SYNC_HOST_PATH:-/opt/pin-manager/dnsmasq-sync}
        target: /sync
        bind:
          create_host_path: true

volumes:
  pin-manager-data:
