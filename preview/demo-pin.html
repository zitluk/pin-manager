<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stránka vyžaduje autorizaci</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(145deg, #1a2332 0%, #2d3a4f 100%);
      color: #eef2f7;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); }
    .modal {
      position: relative; z-index: 1; width: min(420px, 100%);
      background: #f8fafc; color: #1e293b; border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0,0,0,.35); padding: 1.75rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    .domain { font-size: .9rem; color: #475569; word-break: break-all; margin-bottom: 1.25rem; }
    label { font-size: .85rem; font-weight: 600; display: block; margin-bottom: .35rem; }
    input[type="password"] {
      width: 100%; padding: .65rem .75rem; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 1rem; margin-bottom: 1rem;
    }
    .durations { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
    .durations label {
      display: inline-flex; align-items: center; font-weight: 500; cursor: pointer;
      padding: .45rem .75rem; border: 1px solid #cbd5e1; border-radius: 999px; margin: 0;
    }
    .durations input { margin-right: .35rem; }
    button.primary {
      width: 100%; padding: .75rem 1rem; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff;
    }
    .nav { margin-top: 1rem; font-size: .8rem; text-align: center; }
    .nav a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <h1>Autorizace PIN</h1>
    <p class="domain">Požadovaná stránka: <strong>https://tiktok.com/</strong></p>
    <p style="font-size:.8rem;color:#64748b;margin:0 0 1rem">
      (V produkci: uživatel otevřel blokovanou doménu → DNS sinkhole na <code>192.168.39.207</code>)
    </p>
    <form action="demo-redirect.html" method="get">
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" placeholder="1234" />
      <label>Na jak dlouho povolit přístup?</label>
      <div class="durations">
        <label><input type="radio" name="m" value="15" checked /> 15 min</label>
        <label><input type="radio" name="m" value="30" /> 30 min</label>
        <label><input type="radio" name="m" value="60" /> 60 min</label>
        <label><input type="radio" name="m" value="120" /> 120 min</label>
      </div>
      <button type="submit" class="primary">Povolit a pokračovat</button>
    </form>
    <p class="nav"><a href="demo-admin-dashboard.html">← Administrace blacklistu</a></p>
  </div>
</body>
</html>
