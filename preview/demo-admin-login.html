<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přihlášení – PIN manažer</title>
  <link rel="stylesheet" href="../app/pin_manager/static/admin.css" />
</head>
<body class="admin-body">
  <header class="topbar">
    <div class="brand">PIN manažer</div>
  </header>
  <main class="content">
    <div class="card" style="max-width:400px;margin:3rem auto;">
      <h1>Administrace</h1>
      <p class="muted">Přihlaste se admin tokenem z Portaineru / <code>.env</code>.</p>
      <form action="demo-admin-dashboard.html">
        <label for="token">Admin token</label>
        <input id="token" name="token" type="password" value="demo" readonly />
        <button type="submit" class="btn">Přihlásit (náhled)</button>
      </form>
    </div>
  </main>
</body>
</html>
