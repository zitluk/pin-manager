# VOLITELNÉ – jen když na hostiteli JEŠTĚ NEMÁTE macvlan pro 192.168.39.0/24.
# Standardní produkce: nejdřív scripts/create-docker-vlan.sh, pak portainer-stack.yml (external síť).
# Tento soubor nepoužívejte, pokud už existuje docker_vlan → chyba „Pool overlaps“.

services:
  pin-manager:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: pin-manager:latest
    pull_policy: build
    container_name: pin-manager
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      LISTEN_PORT: "80"
      DEPLOY_MODE: vlan
      PORTAL_IP: ${PORTAL_IP:-192.168.39.207}
      VLAN_IP: ${VLAN_IP:-192.168.39.207}
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      PIN: ${PIN}
      PIN_HASH: ${PIN_HASH:-}
      DURATION_OPTIONS: ${DURATION_OPTIONS:-15,30,60,120}
      DNSMASQ_SINKHOLE_PATH: /sync/pin-sinkhole.conf
      PIHOLE_RESTART_DNS: ${PIHOLE_RESTART_DNS:-true}
      PIHOLE_SINKHOLE_MODE: ${PIHOLE_SINKHOLE_MODE:-both}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - pin-manager-data:/data
      - type: bind
        source: ${DNSMASQ_SYNC_HOST_PATH:-/opt/pin-manager/dnsmasq-sync}
        target: /sync
        bind:
          create_host_path: true
    networks:
      pin_macvlan:
        ipv4_address: ${VLAN_IP:-192.168.39.207}

networks:
  pin_macvlan:
    name: pin-manager-macvlan
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:-192.168.39.0/24}
          gateway: ${MACVLAN_GATEWAY:-192.168.39.1}

volumes:
  pin-manager-data:
