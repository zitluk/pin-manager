{% extends "admin_base.html" %}
{% block title %}Registrace administrátora{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:3rem auto;">
  <h1>Registrace administrátora</h1>
  <p class="muted">První spuštění – vytvořte účet. Další registrace nebude možná.</p>
  {% if error %}<div class="flash-err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/register">
    <label for="username">Uživatelské jméno</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    <label for="password">Heslo (min. 8 znaků)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required />
    <label for="password2">Heslo znovu</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" required />
    <button type="submit" class="btn">Zaregistrovat</button>
  </form>
</div>
{% endblock %}
