<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PIN manažer{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="admin-body">
  <header class="topbar">
    <div class="brand">PIN manažer</div>
    {% if show_nav %}
    <nav>
      <a href="/admin/">Blacklist</a>
      <a href="/admin/grants">Aktivní povolení</a>
      <a href="/admin/logs">Protokol</a>
      <form method="post" action="/admin/logout" class="inline">
        <button type="submit" class="link-btn">Odhlásit</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
