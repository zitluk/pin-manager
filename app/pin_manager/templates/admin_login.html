{% extends "admin_base.html" %}
{% block title %}Přihlášení – PIN manažer{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto;">
  <h1>Administrace</h1>
  <p class="muted">Přihlaste se admin tokenem z Portaineru / <code>.env</code>.</p>
  {% if error %}<div class="flash-err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus />
    <button type="submit" class="btn">Přihlásit</button>
  </form>
</div>
{% endblock %}
