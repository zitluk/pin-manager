<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stránka vyžaduje autorizaci</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(145deg, #1a2332 0%, #2d3a4f 100%);
      color: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
    }
    .modal {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      background: #f8fafc;
      color: #1e293b;
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
      padding: 1.75rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    .domain {
      font-size: .9rem;
      color: #475569;
      word-break: break-all;
      margin-bottom: 1.25rem;
    }
    label { font-size: .85rem; font-weight: 600; display: block; margin-bottom: .35rem; }
    input[type="password"] {
      width: 100%;
      padding: .65rem .75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .durations {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }
    .durations label {
      display: inline-flex;
      align-items: center;
      font-weight: 500;
      cursor: pointer;
      padding: .45rem .75rem;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      margin: 0;
    }
    .durations input { margin-right: .35rem; }
    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: .65rem .75rem;
      border-radius: 8px;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
  .actions { display: flex; gap: .75rem; }
    button {
      flex: 1;
      padding: .75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: #fff; }
    .primary:hover { background: #1d4ed8; }
    .secondary { background: #e2e8f0; color: #334155; }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <div class="modal" role="dialog" aria-labelledby="title" aria-modal="true">
    <h1 id="title">Autorizace PIN</h1>
    <p class="domain">Požadovaná stránka: <strong>{{ target_display }}</strong></p>
    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/unlock">
      <input type="hidden" name="target_url" value="{{ target_url }}" />
      <input type="hidden" name="host" value="{{ host }}" />
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus required />
      <label>Na jak dlouho povolit přístup?</label>
      <div class="durations">
        {% for m in duration_options %}
        <label>
          <input type="radio" name="minutes" value="{{ m }}" {% if loop.first %}checked{% endif %} required />
          {{ m }} min
        </label>
        {% endfor %}
      </div>
      <div class="actions">
        <button type="submit" class="primary">Povolit a pokračovat</button>
      </div>
    </form>
    <p style="font-size:.75rem;color:#64748b;margin:1rem 0 0">
      Po úspěchu budete přesměrováni na požadovanou adresu. U některých HTTPS stránek může prohlížeč nejdřív zobrazit varování – po povolení obnovte stránku.
    </p>
  </div>
</body>
</html>
