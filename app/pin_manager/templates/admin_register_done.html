{% extends "admin_base.html" %}
{% block title %}Registrace dokončena{% endblock %}
{% block content %}
<div class="card">
  <h1>Účet je vytvořen</h1>
  <p>Přihlaste se uživatelským jménem <strong>{{ username }}</strong>.</p>
  <p class="muted">API token (pro REST, uložte si ho – znovu se nezobrazí):</p>
  <p><code style="word-break:break-all">{{ api_token }}</code></p>
  <p><a href="/admin/login" class="btn">Přihlásit se</a></p>
</div>
{% endblock %}
