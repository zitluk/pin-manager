# Aktivní stack – po configure.py kopie vlan nebo bridge varianty.
# Doporučení VLAN: nastavte Compose path přímo na portainer-stack.vlan.yml

services:
  pin-manager:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: pin-manager:latest
    container_name: pin-manager
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      LISTEN_PORT: "80"
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      PORTAL_IP: ${PORTAL_IP}
      PIN: ${PIN}
      PIN_HASH: ${PIN_HASH:-}
      DURATION_OPTIONS: ${DURATION_OPTIONS:-15,30,60,120}
      DNSMASQ_SINKHOLE_PATH: /sync/pin-sinkhole.conf
      PIHOLE_RESTART_DNS: ${PIHOLE_RESTART_DNS:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEPLOY_MODE: vlan
    volumes:
      - pin-manager-data:/data
      - pin-manager-dnsmasq:/sync
    networks:
      docker_vlan:
        ipv4_address: ${VLAN_IP}

networks:
  docker_vlan:
    external: true
    name: ${VLAN_NETWORK_NAME:-docker_vlan}

volumes:
  pin-manager-data:
  pin-manager-dnsmasq:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DNSMASQ_SYNC_HOST_PATH}
