# Portainer (Git stack, compose path: portainer-stack.yml).
# Kontejner dostane vlastní IP v LAN přes existující macvlan síť – stránka pak běží na http://VLAN_IP/.
# Bez macvlan použijte docker-compose.yml (port na hostiteli).

services:
  pin-manager:
    build: ./app
    pull_policy: build  # image se staví z ./app, z registru se nic nestahuje
    container_name: pin-manager
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      PIN: ${PIN}
      DURATION_OPTIONS: ${DURATION_OPTIONS:-15,30,60,120}
    volumes:
      - pin-manager-data:/data
    networks:
      lan:
        ipv4_address: ${VLAN_IP:-192.168.39.207}

networks:
  lan:
    external: true
    name: ${MACVLAN_NETWORK_NAME:-docker_vlan}

volumes:
  pin-manager-data:
