name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pytest
        working-directory: app
        run: |
          pip install -q -r requirements-dev.txt
          pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose soubory
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f portainer-stack.yml config >/dev/null
      - name: Build + /health
        run: |
          docker build -t pin-manager:ci ./app
          docker run -d --name pin-smoke -p 9876:80 -e PIN=1234 pin-manager:ci
          sleep 3
          curl -fsS http://127.0.0.1:9876/health | grep -q '"status":"ok"'
          docker rm -f pin-smoke
