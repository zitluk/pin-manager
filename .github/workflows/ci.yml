name: CI – testy a compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pytest (Python 3.12 – stejné jako produkční image)
        run: |
          docker run --rm -v "$PWD/app:/app" -w /app python:3.12-slim bash -ec '
            pip install -q -r requirements-dev.txt
            pytest -q
          '

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          docker compose -f portainer-stack.yml config >/dev/null
          docker compose -f portainer-stack.vlan.yml config >/dev/null
          docker compose -f compose.dev.yml config >/dev/null

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pin-manager:ci ./app
      - name: Smoke – health endpoint
        run: |
          docker run -d --name pin-smoke -p 9876:8080 \
            -e LISTEN_PORT=8080 \
            -e PORTAL_IP= \
            -e PIHOLE_SINKHOLE_MODE=file \
            -e PIHOLE_RESTART_DNS=false \
            -e PIN=1234 \
            -e SESSION_SECRET=ci \
            pin-manager:ci
          sleep 3
          curl -fsS http://127.0.0.1:9876/health | grep -q '"status":"ok"'
          docker rm -f pin-smoke
