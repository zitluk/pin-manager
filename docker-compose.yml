# PIN manažer (sidecar) – napojení na existující Pi-hole v Portaineru.

services:
  pin-manager:
    build: ./app
    container_name: pin-manager
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      TZ: Europe/Prague
      PIHOLE_URL: ${PIHOLE_URL:-http://192.168.88.10}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-changeme}
      PIN: ${PIN:-1234}
      PIN_HASH: ${PIN_HASH:-}
      PORTAL_IP: ${PORTAL_IP:-192.168.1.10}
      DURATION_OPTIONS: ${DURATION_OPTIONS:-15,30,60,120}
      DNSMASQ_SINKHOLE_PATH: /sync/pin-sinkhole.conf
      PIHOLE_RESTART_DNS: ${PIHOLE_RESTART_DNS:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - pin-manager-data:/data
      - type: bind
        source: ${DNSMASQ_SYNC_HOST_PATH:-./dnsmasq-sync}
        target: /sync
        bind:
          create_host_path: true
    networks:
      - pin-manager-net

volumes:
  pin-manager-data:

networks:
  pin-manager-net:
    driver: bridge
