# Nejjednodušší nasazení: stránka na http://IP-HOSTITELE:8080/

services:
  pin-manager:
    build: ./app
    image: pin-manager:latest
    container_name: pin-manager
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      TZ: Europe/Prague
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      PIN: ${PIN}
      DURATION_OPTIONS: ${DURATION_OPTIONS:-15,30,60,120}
    volumes:
      - pin-manager-data:/data

volumes:
  pin-manager-data:
